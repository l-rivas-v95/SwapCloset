name: CI/CD — Test, Build y Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Tests backend ──────────────────────────────────────────────────────────
  test-backend:
    name: Tests Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ejecutar tests
        working-directory: backend
        run: mvn test

  # ── 2. Build y push Docker Hub ────────────────────────────────────────────────
  build-and-push:
    name: Build y Push Imágenes
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/swapcloset-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build y push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/swapcloset-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy en servidor ─────────────────────────────────────────────────────
  deploy:
    name: Deploy al Servidor
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH → pull y reiniciar contenedores
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/swapcloset
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
