<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwapCloset — Descarga la app</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FF3FBF22 0%, #fff 60%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(255, 63, 191, 0.12);
    }

    .logo {
      width: 80px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #111;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 15px;
      color: #888;
      margin-bottom: 36px;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #FF3FBF, #ff6bd6);
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 50px;
      box-shadow: 0 4px 20px rgba(255, 63, 191, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 63, 191, 0.5);
    }

    .btn-download svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .info {
      margin-top: 24px;
      font-size: 13px;
      color: #aaa;
    }

    .badge {
      display: inline-block;
      background: #f5f5f5;
      color: #666;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://lrivasvilla95.duckdns.org/assets/icon/logo-app.png" alt="SwapCloset" onerror="this.style.display='none'" />
    <h1>SwapCloset</h1>
    <p class="tagline">Renueva tu estilo, sin gastar de más</p>

    <a class="btn-download" href="swapcloset.apk" download>
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/>
      </svg>
      Descargar APK
    </a>

    <p class="info">Android · Permite instalación de fuentes desconocidas</p>
    <span class="badge">v1.0</span>
  </div>
</body>
</html>
