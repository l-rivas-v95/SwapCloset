<ion-app>
  <!-- Layout wrapper: flex en desktop, transparente (display:contents) en móvil -->
  <div class="app-layout">
    @if (mostrarShell()) {
      <app-desktop-sidebar></app-desktop-sidebar>
    }
    <div class="page-area">
      <ion-router-outlet></ion-router-outlet>
    </div>
  </div>

  @if (mostrarShell()) {
    <ion-footer>
      <app-menu-footer></app-menu-footer>
    </ion-footer>
  }

  @if (overlay.overlayConfig(); as config) {
    <div class="modal-overlay" (click)="overlay.close(null)">
      <div class="modal-sheet" (click)="$event.stopPropagation()">
        <ng-container *ngComponentOutlet="config.component; inputs: config.inputs"></ng-container>
      </div>
    </div>
  }
</ion-app>
