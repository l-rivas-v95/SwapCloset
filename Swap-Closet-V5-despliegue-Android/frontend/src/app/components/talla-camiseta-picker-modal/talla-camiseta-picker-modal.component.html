<div class="modal-handle-bar"></div>
<div class="modal-header"><span class="modal-title">Talla camiseta</span></div>
<div class="sheet-buttons">
  <button class="sheet-btn" (click)="seleccionar('XS')">XS</button>
  <button class="sheet-btn" (click)="seleccionar('S')">S</button>
  <button class="sheet-btn" (click)="seleccionar('M')">M</button>
  <button class="sheet-btn" (click)="seleccionar('L')">L</button>
  <button class="sheet-btn" (click)="seleccionar('XL')">XL</button>
  <button class="sheet-btn sheet-btn--cancel" (click)="cancelar()">Cancelar</button>
</div>
