<!-- Información básica -->
  <ion-card class="info-card">
    <h2 class="section-title">Información básica</h2>

    <div class="card-body" style="padding: 0 16px 16px;">

      <div class="form-group">
        <label class="native-label">Título *</label>
        <input
          type="text"
          placeholder="Introduce un título"
          [(ngModel)]="titulo"
          (ngModelChange)="onTituloChange($event)"
          required
          class="native-input"
        >
      </div>

      <div class="form-group">
        <label class="native-label">Marca</label>
        <input
          type="text"
          placeholder="Marca del producto"
          [(ngModel)]="marca"
          (ngModelChange)="onMarcaChange($event)"
          class="native-input"
        >
      </div>

      <div class="form-group">
        <label class="native-label">Descripción</label>
        <textarea
          placeholder="Describe la prenda (color, estado, materiales...)"
          rows="3"
          [(ngModel)]="descripcion"
          (ngModelChange)="onDescripcionChange($event)"
          class="native-textarea"
        ></textarea>
      </div>

    </div>
  </ion-card>
