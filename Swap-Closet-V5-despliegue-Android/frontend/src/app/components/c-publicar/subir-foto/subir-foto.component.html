<ion-card class="info-card">

  <!-- Input oculto que abre la cámara directamente -->
  <input
    #cameraInput
    type="file"
    accept="image/*"
    capture="environment"
    hidden
    (change)="onCameraFile($event)">

  <h2 class="section-title">Fotos</h2>

  <ion-grid class="centro-separador">
    <ion-button fill="clear" class="btn-agregar-foto" (click)="abrirCamara()">
      <ion-icon size="large" name="camera"></ion-icon>
      <p class="margen">Añadir fotos</p>
    </ion-button>
    <ion-button fill="clear" class="btn-agregar-galeria" (click)="abrirGaleria()">
      <ion-icon size="large" name="image"></ion-icon>
      <p class="margen">Galería</p>
    </ion-button>
  </ion-grid>

  @if (subiendo) {
    <div style="text-align:center; padding: 8px;">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  }

  @if (fotos.length > 0) {
    <div class="preview-grid">
      @for (foto of fotos; track foto) {
        <div class="preview-item">
          <img [src]="foto" alt="Imagen seleccionada">
          <ion-button fill="clear" size="small" class="btn-eliminar" (click)="eliminarFoto($event, foto)">
            <ion-icon name="close-circle"></ion-icon>
          </ion-button>
        </div>
      }
    </div>
  }

</ion-card>
