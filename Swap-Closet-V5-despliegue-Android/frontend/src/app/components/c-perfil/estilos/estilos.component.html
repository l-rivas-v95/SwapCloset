<ion-card class="info-card fondo">
  
    <h2 class="section-title">{{ esMiPerfil ? 'Mi estilo' : 'Estilo' }}</h2>
  

  <div class="card-body" style="padding: 0 16px 16px;">
    <div class="section">
      <div class="chip-group">
        <span class="chip-rosa" *ngFor="let est of estilosSeleccionados">
          {{ est }}
          <button *ngIf="esMiPerfil" class="btn-close" (click)="eliminarEstilo(est)">
            <ion-icon name="close-circle"></ion-icon>
          </button>
        </span>

        <button *ngIf="esMiPerfil" class="chip-add" (click)="agregarEstilo()">
          <ion-icon name="add-outline"></ion-icon>
        </button>
      </div>
    </div>
  </div>
</ion-card>
