<ion-card class="info-card">
  
    <h2 class="section-title">{{ esMiPerfil ? 'Mis tallas' : 'Tallas' }}</h2>
  

  <div class="card-body" style="padding: 0 16px 16px;">
    <div class="tallas-container">
      <div class="talla-item">
        <p>Camiseta</p>
        <button
          class="talla-chip"
          [class.talla-chip-editable]="esMiPerfil"
          (click)="elegirTalla('tCamiseta')">
          {{ usuario()?.tCamiseta || '-' }}
        </button>
      </div>

      <div class="talla-item">
        <p>Pantalon</p>
        <button
          class="talla-chip"
          [class.talla-chip-editable]="esMiPerfil"
          (click)="elegirTalla('tPantalon')">
          {{ usuario()?.tPantalon || '-' }}
        </button>
      </div>

      <div class="talla-item">
        <p>Calzado</p>
        <button
          class="talla-chip"
          [class.talla-chip-editable]="esMiPerfil"
          (click)="elegirTalla('tCalzado')">
          {{ usuario()?.tCalzado || '-' }}
        </button>
      </div>
    </div>
  </div>
</ion-card>
