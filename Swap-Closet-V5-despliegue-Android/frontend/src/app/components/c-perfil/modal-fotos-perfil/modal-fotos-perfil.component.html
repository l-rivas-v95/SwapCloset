<div class="modal-handle-bar"></div>

<div class="modal-header">
  <span class="modal-title">Seleccionar foto de perfil</span>
  <button class="modal-close-btn" (click)="close()">
    <ion-icon name="close"></ion-icon>
  </button>
</div>

<div class="modal-body">
  <div class="subir-imagen">
    <ion-icon name="image-outline"></ion-icon>
    <h3>Subir foto de perfil</h3>
    <p>Selecciona una imagen desde tu dispositivo.</p>

    <label class="boton-subir">
      Elegir imagen
      <input
        type="file"
        accept="image/*"
        hidden
        (change)="seleccionarArchivo($event)">
    </label>

    <ion-spinner *ngIf="subiendo" name="crescent"></ion-spinner>
    <p *ngIf="subiendo">Subiendo imagen...</p>
  </div>
</div>
