<div class="centro">
  <div class="contenedor-imagen-producto">
    <img [src]="getPrimeraImagen()" (error)="onImgError($event)" class="imagen-producto" alt="Imagen del producto"/>
  </div>
  <ion-chip [ngClass]="producto?.tipo === 'Intercambio' ? 'chip-rosa' : 'chip-azul'">{{producto?.tipo}}</ion-chip>
</div>
