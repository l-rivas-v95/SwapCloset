<div class="modal-handle-bar"></div>

<div class="modal-header toolbar-rosa">
  <button class="modal-close-btn btn-cancelar" (click)="dismiss()">Cancelar</button>
  <span class="modal-title titulo-modal">📍 Lugar del intercambio</span>
  <button class="modal-close-btn btn-confirmar" (click)="confirm()" [disabled]="!searchQuery.trim()">Proponer</button>
</div>

<div class="modal-body fondo-modal">
  <div class="search-row">
    <ion-input
      class="input-lugar"
      placeholder="Ej: Plaza de España, Sevilla"
      [(ngModel)]="searchQuery"
      (keyup.enter)="buscar()"
      clearInput>
    </ion-input>
    <ion-button class="btn-buscar" (click)="buscar()">
      <ion-icon name="search-outline"></ion-icon>
    </ion-button>
  </div>

  @if (!buscado) {
    <div class="mapa-placeholder">
      <ion-icon name="map-outline"></ion-icon>
      <p>Escribe una dirección y pulsa buscar</p>
    </div>
  }

  @if (buscado && mapUrl) {
    <div class="mapa-wrapper">
      <iframe [src]="mapUrl" class="mapa-iframe" allowfullscreen loading="lazy"></iframe>
    </div>
    <p class="hint-texto">¿Es aquí? Pulsa <b>Proponer</b> para enviarlo.</p>
  }
</div>
