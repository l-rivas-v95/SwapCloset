<ion-header>
  <ion-toolbar class="toolbar-rosa">
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()" class="btn-cancelar">Cancelar</ion-button>
    </ion-buttons>
    <ion-title class="titulo-modal">📍 Lugar del intercambio</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="confirm()" [strong]="true" [disabled]="!searchQuery.trim()" class="btn-confirmar">
        Proponer
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="fondo-modal">
  <div class="search-row">
    <ion-input
      class="input-lugar"
      placeholder="Ej: Plaza de España, Sevilla"
      [(ngModel)]="searchQuery"
      (keyup.enter)="buscar()"
      clearInput>
    </ion-input>
    <ion-button class="btn-buscar" (click)="buscar()">
      <ion-icon name="search-outline"></ion-icon>
    </ion-button>
  </div>

  @if (!buscado) {
    <div class="mapa-placeholder">
      <ion-icon name="map-outline"></ion-icon>
      <p>Escribe una dirección y pulsa buscar</p>
    </div>
  }

  @if (buscado && mapUrl) {
    <div class="mapa-wrapper">
      <iframe [src]="mapUrl" class="mapa-iframe" allowfullscreen loading="lazy"></iframe>
    </div>
    <p class="hint-texto">¿Es aquí? Pulsa <b>Proponer</b> para enviarlo.</p>
  }
</ion-content>
