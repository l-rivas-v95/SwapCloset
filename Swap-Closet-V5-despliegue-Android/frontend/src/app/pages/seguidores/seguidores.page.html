<ion-header class="fondo bordes-redondeados">
  <ion-toolbar class="menu-superior fondo">
    <ion-grid>

      <ion-row class="caja-menu-sup">

        <ion-col size="2">
          <ion-button fill="clear" (click)="volver()">
            <ion-icon size="large" name="arrow-back-outline"></ion-icon>
          </ion-button>
        </ion-col>

        <ion-col>
          <h2 class="titulo"><b>Seguidores</b></h2>
        </ion-col>

        <ion-col size="2" class="derecha">
          <ion-icon style="font-size: 28px;" name="people"></ion-icon>
        </ion-col>

      </ion-row>
    </ion-grid>
  </ion-toolbar>

  <ion-toolbar class="fondo">
    <ion-grid>
      <ion-row>
        <ion-col>
          <div class="botones-seleccion">
            <button class="seg-btn"
              [style.background]="segmentoSeleccionado === 'seguidores' ? '#FFE2E3' : 'transparent'"
              [style.color]="segmentoSeleccionado === 'seguidores' ? '#FF3FBF' : '#7a7a7a'"
              (click)="segmentoSeleccionado = 'seguidores'">Seguidores</button>
            <button class="seg-btn"
              [style.background]="segmentoSeleccionado === 'siguiendo' ? '#C6DFFF' : 'transparent'"
              [style.color]="segmentoSeleccionado === 'siguiendo' ? '#3F42FF' : '#7a7a7a'"
              (click)="segmentoSeleccionado = 'siguiendo'">Siguiendo</button>
          </div>
        </ion-col>
      </ion-row>

      <ion-row class="centro">
        <ion-col>
          <div class="search-box">
            <ion-icon name="search-outline" class="search-icon"></ion-icon>
            <input class="search-input" type="search" placeholder="Buscar persona"
              (input)="busqueda = $any($event.target).value">
          </div>
        </ion-col>
      </ion-row>

    </ion-grid>
  </ion-toolbar>
</ion-header>


<ion-content>
  <ion-grid>

    <!-- SEGUIDORES -->
    <ion-row *ngIf="segmentoSeleccionado === 'seguidores'">
      <ion-col size="12" *ngFor="let seguidor of filtrar(seguidores())">
        <app-tarjeta-seguidor [usuario]="seguidor"></app-tarjeta-seguidor>
      </ion-col>

      <ion-col size="12" *ngIf="seguidores().length === 0">
        <p>No tienes seguidores.</p>
      </ion-col>
    </ion-row>

    <!-- SIGUIENDO -->
    <ion-row *ngIf="segmentoSeleccionado === 'siguiendo'">
      <ion-col size="12" *ngFor="let seguido of filtrar(seguidos())">
        <app-tarjeta-seguidor [usuario]="seguido"></app-tarjeta-seguidor>
      </ion-col>

      <ion-col size="12" *ngIf="seguidos().length === 0">
        <p>No estás siguiendo a nadie.</p>
      </ion-col>
    </ion-row>

  </ion-grid>
</ion-content>
