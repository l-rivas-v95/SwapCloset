<ion-content class="fondo">
  <div class="contenedor-central">
    <div class="contenedor-logo">
      <img src="assets/icon/logo-app.png" alt="Logo Swap" class="logo" />
      <p class="subtitulo">Renueva tu estilo, sin gastar de más</p>
    </div>

    <div class="card-login">
      <h2 class="titulo">
        {{ modoRegistro ? 'Únete a la comunidad' : '¡Bienvenido de vuelta!' }}
      </h2>

      <!-- Pestañas -->
      <div class="tabs">
        <button
          type="button"
          class="tab"
          [class.activo]="!modoRegistro"
          (click)="modoRegistro = false"
        >
          Iniciar Sesión
        </button>

        <button
          type="button"
          class="tab"
          [class.activo]="modoRegistro"
          (click)="modoRegistro = true"
        >
          Registro
        </button>
      </div>

      <!-- FORMULARIO LOGIN / REGISTRO -->
      @if (!modoRegistro) {
        <!-- FORMULARIO LOGIN -->
        <ion-list lines="none" class="lista-form">
          <ion-item class="input-item">
            <ion-icon name="mail-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="Correo electrónico"
              [(ngModel)]="correoSign"
            ></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="password"
              autocomplete="current-password"
              placeholder="Contraseña"
              [(ngModel)]="passwordSign"
            ></ion-input>
          </ion-item>
        </ion-list>

        <div class="acciones">
          <a href="#" class="olvide">¿Olvidaste tu contraseña?</a>

          <div class="recordar">
            <ion-checkbox class="checkbox"></ion-checkbox>
            <label>Recordar contraseña</label>
          </div>
        </div>

        <ion-button
          type="button"
          fill="clear"
          expand="block"
          class="btn-iniciar"
          (click)="login()"
        >
          Iniciar Sesión
        </ion-button>
      } @else {
        <!-- FORMULARIO REGISTRO -->
        <ion-list lines="none" class="lista-form">
          <ion-item class="input-item">
            <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="text"
              autocomplete="given-name"
              placeholder="Nombre"
              [(ngModel)]="nombre"
            ></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="text"
              autocomplete="family-name"
              placeholder="Apellidos"
              [(ngModel)]="apellidos"
            ></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="mail-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="Correo electrónico"
              [(ngModel)]="correo"
            ></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="password"
              autocomplete="new-password"
              placeholder="Contraseña"
              [(ngModel)]="password"
            ></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="password"
              autocomplete="new-password"
              placeholder="Repetir contraseña"
              [(ngModel)]="password2"
            ></ion-input>
          </ion-item>
        </ion-list>

        <ion-button
          type="button"
          fill="clear"
          expand="block"
          class="btn-iniciar"
          (click)="guardarUsuario()"
        >
          Crear cuenta
        </ion-button>
      }

      <!-- Botón Google -->
      <div class="google-box">
        <p class="o">o</p>
        <ion-button type="button" expand="block" fill="clear" class="btn-google">
          <ion-icon name="logo-google" class="google-icon" slot="start" aria-hidden="true"></ion-icon>
          Continuar con Google
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
