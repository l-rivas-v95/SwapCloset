<ion-content class="fondo">
  <div class="contenedor-central">

    <!-- DESKTOP: split wrapper -->
    <div class="d-split-login">

    <div class="contenedor-logo">
      <img src="assets/icon/logo-app.png" alt="Logo Swap" class="logo" />
      <p class="subtitulo">Renueva tu estilo, sin gastar de más</p>

      <!-- QR descarga app -->
      <div class="d-qr-box">
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://lrivasvilla95.duckdns.org/swapcloset/apk/&color=ffffff&bgcolor=FF3FBF"
          alt="QR descarga"
          class="d-qr-img" />
        <p class="d-qr-label">Descarga la app</p>
        <div class="d-qr-android">
          <svg viewBox="0 0 24 24" fill="currentColor" class="d-android-icon"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48A5.96 5.96 0 0 0 12 1c-.96 0-1.86.23-2.66.63L7.88.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31A5.96 5.96 0 0 0 6 7h12a5.96 5.96 0 0 0-2.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/></svg>
          <span>Disponible para Android</span>
        </div>
      </div>
    </div>

    <div class="card-login">
      <div class="d-form-inner">
      <h2 class="titulo">
        {{ modoRegistro ? 'Únete a la comunidad' : '¡Bienvenido de vuelta!' }}
      </h2>

      <!-- Pestañas -->
      <div class="tabs">
        <button
          type="button"
          class="tab"
          [class.activo]="!modoRegistro"
          (click)="modoRegistro = false"
        >
          Iniciar Sesión
        </button>

        <button
          type="button"
          class="tab"
          [class.activo]="modoRegistro"
          (click)="modoRegistro = true"
        >
          Registro
        </button>
      </div>

      <!-- FORMULARIO LOGIN / REGISTRO -->
      @if (!modoRegistro) {
        <!-- FORMULARIO LOGIN -->
        <ion-list lines="none" class="lista-form">
          <ion-item class="input-item">
            <ion-icon name="mail-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="Correo electrónico"
              [(ngModel)]="correoSign"
            ></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="password"
              autocomplete="current-password"
              placeholder="Contraseña"
              [(ngModel)]="passwordSign"
            ></ion-input>
          </ion-item>
        </ion-list>

        <div class="acciones">
          <a href="#" class="olvide">¿Olvidaste tu contraseña?</a>

          <div class="recordar">
            <ion-checkbox class="checkbox" [(ngModel)]="recordar"></ion-checkbox>
            <label>Recordar contraseña</label>
          </div>
        </div>

        <ion-button
          type="button"
          fill="clear"
          expand="block"
          class="btn-iniciar"
          (click)="login()"
        >
          Iniciar Sesión
        </ion-button>
      } @else {
        <!-- FORMULARIO REGISTRO -->
        <ion-list lines="none" class="lista-form">
          <ion-item class="input-item">
            <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="text"
              autocomplete="given-name"
              placeholder="Nombre"
              [(ngModel)]="nombre"
            ></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="text"
              autocomplete="family-name"
              placeholder="Apellidos"
              [(ngModel)]="apellidos"
            ></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="mail-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="Correo electrónico"
              [(ngModel)]="correo"
            ></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="password"
              autocomplete="new-password"
              placeholder="Contraseña"
              [(ngModel)]="password"
            ></ion-input>
          </ion-item>

          <ion-item class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
            <ion-input
              type="password"
              autocomplete="new-password"
              placeholder="Repetir contraseña"
              [(ngModel)]="password2"
            ></ion-input>
          </ion-item>
        </ion-list>

        <ion-button
          type="button"
          fill="clear"
          expand="block"
          class="btn-iniciar"
          (click)="guardarUsuario()"
        >
          Crear cuenta
        </ion-button>
      }

      <!-- Botón Google -->
      <div class="google-box">
        <p class="o">o</p>
        <ion-button type="button" expand="block" fill="clear" class="btn-google" disabled>
          <ion-icon name="logo-google" class="google-icon" slot="start" aria-hidden="true"></ion-icon>
          Continuar con Google
        </ion-button>
      </div>
      </div><!-- /d-form-inner -->
    </div>

    </div><!-- /d-split-login -->
  </div>
</ion-content>
