<ion-header class="fondo bordes-redondeados">
  <ion-toolbar class="menu-superior fondo">
    <ion-grid>
      <ion-row class="caja-menu-sup">
        <ion-col>
          <h1 class="izquierda"><b>Mensajes</b></h1>
        </ion-col>
        <ion-col class="derecha">
          <ion-icon style="font-size: 45px;" name="chatbubble-outline"></ion-icon>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>

  <ion-toolbar class="fondo">
    <ion-grid>
      <ion-row>
        <ion-col>
          <div class="botones-seleccion">
            <button class="seg-btn"
              [style.background]="segmento() === 'todos' ? '#ffd6e0' : 'transparent'"
              [style.color]="segmento() === 'todos' ? '#ff3f84' : '#7a7a7a'"
              (click)="segmento.set('todos')">Todos</button>
            <button class="seg-btn"
              [style.background]="segmento() === 'Activos' ? '#ffd6e0' : 'transparent'"
              [style.color]="segmento() === 'Activos' ? '#ff3f84' : '#7a7a7a'"
              (click)="segmento.set('Activos')">Activos</button>
            <button class="seg-btn"
              [style.background]="segmento() === 'Completados' ? '#ffd6e0' : 'transparent'"
              [style.color]="segmento() === 'Completados' ? '#ff3f84' : '#7a7a7a'"
              (click)="segmento.set('Completados')">Listos</button>
          </div>
        </ion-col>
      </ion-row>

      <ion-row class="centro">
        <ion-col>
          <ion-searchbar class="barra" placeholder="Buscar mensaje"
            (ionInput)="busqueda.set($event.detail.value ?? '')"></ion-searchbar>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (chatsFiltrados().length === 0) {
    <div class="empty-state">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <p>No tienes conversaciones todavía</p>
    </div>
  }
  @for (chat of chatsFiltrados(); track chat.id) {
    <app-carta-chat [chat]="chat" [miUsuarioId]="miUsuarioId" [busqueda]="busqueda()"></app-carta-chat>
  }
</ion-content>
