<!-- ── Header móvil ── -->
<ion-header class="bordes-redondeados fondo mobile-header">
  <ion-toolbar class="menu-superior fondo">
    <ion-grid>
      <ion-row class="caja-menu-sup">
        <h1 class="margen izquierda"><b>Tendencias</b></h1>
      </ion-row>
    </ion-grid>
  </ion-toolbar>

  <ion-toolbar class="fondo toolbar-cats">
    <div class="cats-row">
      @for (cat of filtros.categorias; track cat.label) {
        <button class="cat-pill"
          [style.background]="filtros.categoriaFiltro() === cat.label ? cat.solid : cat.alpha"
          [style.color]="filtros.categoriaFiltro() === cat.label ? '#fff' : cat.solid"
          (click)="filtros.seleccionarCategoria(cat.label)">
          {{ cat.label }}
        </button>
      }
    </div>
  </ion-toolbar>
</ion-header>

<!-- ── Topbar desktop ── -->
<div class="d-topbar desktop-only">
  <h2 class="d-topbar-title">Tendencias</h2>
</div>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-outline"
      refreshingSpinner="crescent">
    </ion-refresher-content>
  </ion-refresher>

  <div class="home-grid">
    @for(pro of productosFiltrados(); track pro.productoId){
      @if(pro.productoId !== undefined && pro.productoId !== null){
        <app-carta-home-intercambio
          [producto]="pro"
          [routerLink]="['/anuncio', pro.productoId]"
          class="contenedor-cartas"/>
      }
    }
  </div>
</ion-content>
