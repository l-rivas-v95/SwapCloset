server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ===============================
  # Proxy /api -> Backend Render
  # ===============================
  location /api/ {
    proxy_pass https://proyecto-swapcloset-luis-rivas-villa.onrender.com/api/;

    proxy_http_version 1.1;

    # SNI correcto (TLS)
    proxy_ssl_server_name on;
    proxy_ssl_name proyecto-swapcloset-luis-rivas-villa.onrender.com;

    # Host del upstream (backend)
    proxy_set_header Host proyecto-swapcloset-luis-rivas-villa.onrender.com;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_buffering off;
  }

  # ===============================
  # Static files (JS/CSS/Images/Fonts)
  # ===============================
  location ~* \.(?:css|js|mjs|map|json|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # ===============================
  # Angular / Ionic SPA routing
  # ===============================
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Si Nginx cae en 404 (p.ej. /login), devuélvelo al index de la SPA
  error_page 404 /index.html;

  # Evitar cachear index.html (para que no se quede “viejo” con hashes nuevos)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    expires -1;
  }
}
