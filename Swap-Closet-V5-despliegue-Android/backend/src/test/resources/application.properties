spring.datasource.url=jdbc:h2:mem:SwapCloset;MODE=MariaDB;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# JWT (valor ficticio para tests)
jwt.secret=test-secret-key-solo-para-tests-no-usar-en-produccion-minimo-32-chars

# Cloudinary (no se usa en tests unitarios)
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false
