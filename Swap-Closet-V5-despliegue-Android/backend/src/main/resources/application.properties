spring.application.name=backend

# ── Base de datos ──────────────────────────────────────────────────────────────
# Desarrollo local: sobreescribe con variables de entorno en producción (Render, Docker, etc.)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swap_closet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ── Cloudinary ─────────────────────────────────────────────────────────────────
# Configura estas variables de entorno en tu entorno de despliegue
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── Servidor ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Subida de archivos ─────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.docker.compose.enabled=false

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── Spring Security ────────────────────────────────────────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false
